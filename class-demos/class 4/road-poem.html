<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沿着一条长长的，没有尽头的路</title>
<style>
  /* ---- canvas model -------------------------------------------------
     The original frame is 2020 x 1130. --u is one "frame pixel" expressed
     in viewport units, so every size and coordinate below is written in
     the original pixel numbers and scales as one block.
  -------------------------------------------------------------------- */
  :root{
    --u: calc(100vw / 2020);
    --ink: #ffffff;
    --ground: #000000;
    --cjk: "Noto Sans Mono CJK SC", "Sarasa Mono SC", "Source Han Sans SC",
           "PingFang SC", "Heiti SC", "Microsoft YaHei", "SimHei", monospace;
    --latin: "DejaVu Sans Mono", "Courier New", Courier, monospace;
  }

  html, body{
    margin:0;
    padding:0;
    background: var(--ground);
    color: var(--ink);
  }

  .stage{
    position: relative;
    width: 100vw;
    height: calc(1130 * var(--u));
    overflow: hidden;
    background: var(--ground);
    /* crisp, bitmap-ish edges rather than heavy antialiasing */
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  /* every text run is placed from the top-left of the frame */
  .t{
    position: absolute;
    white-space: pre;
    line-height: 1;
    font-weight: 400;
  }

  .cjk{ font-family: var(--cjk); }
  .latin{ font-family: var(--latin); }

  /* ---- individual runs ---------------------------------------------- */

  /* opening line */
  .line-open{
    left: calc(215 * var(--u));
    top:  calc(296 * var(--u));
    font-size: calc(50 * var(--u));
    letter-spacing: calc(1 * var(--u));
  }

  /* 巷 我 巷 — 我 sits a touch higher than the two 巷 */
  .xiang-left-1{
    left: calc(770 * var(--u));
    top:  calc(377 * var(--u));
    font-size: calc(50 * var(--u));
  }
  .wo{
    left: calc(822 * var(--u));
    top:  calc(362 * var(--u));
    font-size: calc(50 * var(--u));
  }
  .xiang-right-1{
    left: calc(872 * var(--u));
    top:  calc(377 * var(--u));
    font-size: calc(50 * var(--u));
  }

  /* second 巷 pair, spread wider */
  .xiang-left-2{
    left: calc(770 * var(--u));
    top:  calc(437 * var(--u));
    font-size: calc(50 * var(--u));
  }
  .xiang-right-2{
    left: calc(884 * var(--u));
    top:  calc(437 * var(--u));
    font-size: calc(50 * var(--u));
  }

  /* the two roads: flush to both edges, 42 glyph cells wide */
  .road{
    left: 0;
    width: calc(2020 * var(--u));
    font-size: calc(48 * var(--u));
    letter-spacing: 0;
  }
  .road-1{ top: calc(482 * var(--u)); }
  .road-2{ top: calc(688 * var(--u)); }

  /* closing note */
  .note{
    left: 0;
    width: calc(2020 * var(--u));
    text-align: center;
    font-size: calc(33 * var(--u));
    letter-spacing: calc(9 * var(--u));
    /* letter-spacing adds a trailing gap; pull back by half to re-centre */
    text-indent: calc(9 * var(--u));
  }
  .note-1{ top: calc(908 * var(--u)); }
  .note-2{ top: calc(956 * var(--u)); }
</style>
</head>
<body>
  <div class="stage">

    <div class="t cjk line-open">沿着一条长长的，没有尽头的路</div>

    <div class="t cjk xiang-left-1">巷</div>
    <div class="t cjk wo">我</div>
    <div class="t cjk xiang-right-1">巷</div>

    <div class="t cjk xiang-left-2">巷</div>
    <div class="t cjk xiang-right-2">巷</div>

    <div class="t cjk road road-1">路路路路路路路路路路路路路路路路路 路路路路路路路路路路路路路路路路路路路路路路路路</div>
    <div class="t cjk road road-2">路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路路</div>

    <div class="t latin note note-1">most i first built the draft of the puzzles, then fed them to</div>
    <div class="t latin note note-2">Claude to help me code the final product.</div>

  </div>
</body>
</html>
