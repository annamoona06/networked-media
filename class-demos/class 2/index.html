<!--this is a continuation off of last class's demo<-->
<!-- right click document - format document - configure prettier - to make our code look nice-->

<html>
  <head>
    <title>Networked Media class 2 demo</title>
    <!-- the title is the name of the webpage on the tab in the browser-->
    <!-- the location of the file in your laptop will be revealed in the browser as browser url-->
    <!-- title is the child of head, which makes title the grandchild of html-->
  </head>
  <body>
    <!-- body holds all of the content on our webpage, so a lot of what we are making will be in here. -->
    <!--hyper text markup language: we are saying text and saying what kind of text it is.-->
    <!-- hotkey - command s - open file in browser - command r-->
    this text here is untagged
    <!-- this h1 classifiesthe text as "header"-->
    <h1>HEADER</h1>
    <p>this is a normal paragraph</p>
    <p>this has <em>italics.</em> Only text within the "em" is italicized.</p>
    <strong>this is bolded<strong>
    <code>
      <!-- render this comment-->
    </code>
    <!-- when we use p, they automatically skip a line, but when we use em or strong, they are automatically stacked horizontally instead of vertically. -->
     <!--block: stacked vertically hence require new line (headers, paragraphs,). in-line: stacked horizaontally hence does not require new line(em, strong, atab, spams, code). -->

    <!-- generic type of element-->
     <div>
      <!--dviding element-->
      <!--this is ussually used as a layer or to group content -->
      <p> this paragraph is in a div</p>
      <p> these paragraph are all in a group</p>
     </div>
     <!-- this tag does not have any content-->
     <hr />
     <span>hi</span>
     <span>greetings</span> <!-- this willl not be rendered as new line, it is simply for better reading.-->
     <span>hello</span> <!-- this is for styling-->
     <img src="opanchuUsagi4.png"> <!-- its better to resize photos externally instead on in code because it will take longer to load web-->
     <img src="https://tse1.mm.bing.net/th/id/OIP.GGGqYeV1qWtlc2hHVRPI0AHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
  </body>
</html>
